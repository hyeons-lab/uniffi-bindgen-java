name: Rust CI
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 0 14 * * 1
# Cancel stale runs from older commits on the same ref. Saves CI
# minutes when a PR receives multiple pushes in rapid succession
# (the slow `kotlin-ci` macos-26 leg adds up). `github.ref` scopes
# per-PR (refs/pull/<n>/merge) and per-branch (refs/heads/<name>),
# so different PRs and `main` runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED

  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust tests
        run: cargo test --lib --bins --tests
        env:
          JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED

  kotlin-ci:
    name: Kotlin runtime tests (${{ matrix.os }}, JDK ${{ matrix.jdk }})
    strategy:
      fail-fast: false
      matrix:
        # JDK floor is 22 — that's where `java.lang.foreign.*` (the
        # FFM API the Kotlin codegen uses for downcalls and upcall
        # stubs) became a stable, non-preview feature. JDK 21 has
        # FFM as preview only; JDK 17 has no FFM at all. Top end
        # is JDK 25 (current LTS).
        # Pin runner images explicitly. `*-latest` aliases roll
        # forward whenever GitHub bumps the default, which can
        # silently change tool versions or default shells under
        # us. Macos was already pinned (#59); now matching pattern
        # for the other two.
        os: [ubuntu-24.04, macos-26, windows-2025]
        jdk: ['22', '25']
    runs-on: ${{ matrix.os }}
    env:
      JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      # `fwilhe2/setup-kotlin` uses `@actions/tool-cache` which writes
      # under `RUNNER_TOOL_CACHE` (e.g. `/opt/hostedtoolcache`). That
      # cache lives on the runner image and isn't preserved across
      # workflow runs, so kotlinc gets re-downloaded (~80 MB) on every
      # job. Pinning the kotlin subtree of the tool cache keyed on
      # OS+version lets the second-and-later runs hit the cache.
      - name: Cache kotlinc
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/kotlin
          key: kotlinc-${{ runner.os }}-2.3.20
      - name: Set up Kotlin
        uses: fwilhe2/setup-kotlin@v1
        with:
          version: 2.3.20
      - name: Install Rust toolchain (keep in sync with rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      # `tests/tests.rs::ensure_kotlinx_coroutines_jar` lazily downloads
      # `kotlinx-coroutines-core-jvm-<VERSION>.jar` from Maven Central
      # to `target/kotlin-deps/` on first test run. `Swatinem/rust-cache`
      # only caches the standard `target/<profile>` subtree, so this
      # custom path needs its own cache step. Key includes the version
      # so a bump invalidates and re-downloads.
      - name: Cache kotlinx-coroutines JAR
        uses: actions/cache@v5
        with:
          path: target/kotlin-deps
          key: kotlinx-coroutines-${{ runner.os }}-1.10.2
      # macos-26 GitHub runners exhibit parallel-test contention that
      # ubuntu-latest doesn't — observed in #56 (`test_fixture_futures_kotlin`
      # transient failures) and now confirmed on the cancelled
      # `macos-26 / JDK 22` leg of this matrix's first run, where 5
      # tests sat in `running for over 60 seconds` for 20+ min before
      # the concurrency cancel arrived. Forcing serial execution on
      # macos-26 trades total wall time for reliability — ubuntu still
      # runs parallel.
      - name: Run Kotlin runtime tests
        # `shell: bash` for cross-platform — Windows runners default
        # to powershell for `run:` steps, which doesn't understand
        # `[ ... = ... ]` test syntax. GitHub-hosted Windows runners
        # ship Git Bash so `bash` is available.
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo test --test tests kotlin -- --ignored --test-threads=1
          else
            cargo test --test tests kotlin -- --ignored
          fi
