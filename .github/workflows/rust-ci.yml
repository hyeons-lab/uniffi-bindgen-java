name: Rust CI
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 0 14 * * 1

# Cancel stale runs from older commits on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Suppress Node.js 20 deprecation warnings and opt into Node.js 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac21075357c0e7ff1d684097c73c32e9decd # v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8448aa2398e0d4a052c2ff4e7478702d8e # v1
        with:
          toolchain: 1.94.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac21075357c0e7ff1d684097c73c32e9decd # v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8448aa2398e0d4a052c2ff4e7478702d8e # v1
        with:
          toolchain: 1.94.0
          components: clippy
      - uses: Swatinem/rust-cache@c193711c4f238f903ba199a1e0ef887162649711 # v2.9.1
      - run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED

  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac21075357c0e7ff1d684097c73c32e9decd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@f2beeb2480e51444637a396e6206148556d0666c # v5.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8448aa2398e0d4a052c2ff4e7478702d8e # v1
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@c193711c4f238f903ba199a1e0ef887162649711 # v2.9.1
      - name: Run Rust tests
        run: cargo test --lib --bins --tests
        env:
          JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED

  kotlin-ci:
    name: Kotlin runtime tests (${{ matrix.os }}, JDK ${{ matrix.jdk }})
    strategy:
      fail-fast: false
      matrix:
        # JDK floor is 22. Top end is JDK 25 (current LTS).
        os: [ubuntu-24.04, macos-26, windows-2025]
        jdk: ['22', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
    steps:
      - uses: actions/checkout@de0fac21075357c0e7ff1d684097c73c32e9decd # v6.0.2
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@f2beeb2480e51444637a396e6206148556d0666c # v5.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      # Pinning the kotlin subtree of the tool cache keyed on OS+version.
      - name: Cache kotlinc
        uses: actions/cache@1bd1f32a3514402c753730760744d10ad2dd2fa6 # v5.0.0
        with:
          path: ${{ runner.tool_cache }}/kotlin
          key: kotlinc-${{ runner.os }}-2.3.20
      - name: Set up Kotlin
        uses: fwilhe2/setup-kotlin@7163c927163c927163c927163c927163c927163c # v1.8
        with:
          version: 2.3.20
      - name: Install Rust toolchain (keep in sync with rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@e97e2d8448aa2398e0d4a052c2ff4e7478702d8e # v1
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@c193711c4f238f903ba199a1e0ef887162649711 # v2.9.1
      # Custom cache for kotlinx-coroutines JAR.
      - name: Cache kotlinx-coroutines JAR
        uses: actions/cache@1bd1f32a3514402c753730760744d10ad2dd2fa6 # v5.0.0
        with:
          path: target/kotlin-deps
          key: kotlinx-coroutines-${{ runner.os }}-1.10.2
      - name: Run Kotlin runtime tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo test --test tests kotlin -- --ignored --test-threads=1
          else
            cargo test --test tests kotlin -- --ignored
          fi
