name: Rust CI
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 0 14 * * 1
jobs:
  rust-ci:
    uses: IronCoreLabs/workflows/.github/workflows/rust-ci.yaml@rust-ci-v2
    with:
      run_clippy: true
      minimum_coverage: "0"
      cargo_command_env_vars: "PATH=$JAVA_HOME_25_X64/bin:$PATH JDK_JAVA_OPTIONS=--enable-native-access=ALL-UNNAMED"
    secrets: inherit

  kotlin-ci:
    name: Kotlin runtime tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Kotlin
        uses: fwilhe2/setup-kotlin@v1
        with:
          version: 2.3.20
      - name: Install Rust toolchain (keep in sync with rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Run Kotlin runtime tests
        run: cargo test --test tests kotlin -- --ignored
